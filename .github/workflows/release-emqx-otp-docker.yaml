name: Release EMQX OTP Docker image

on:
  push:
    tags: ['docker-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing docker-* source tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: emqx-otp-docker-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: tryao/emqx-otp-oss

jobs:
  precheck:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve immutable source tag
        id: source
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^docker-[0-9A-Za-z._-]+$ ]]
          REVISION="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          OTP_VERSION="$(git show "${REVISION}:OTP_VERSION")"
          VERSION="${TAG#docker-}"
          test "$VERSION" = "${OTP_VERSION}-1-debian13"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

  build:
    needs: precheck
    runs-on: ${{ matrix.runner }}
    environment: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.precheck.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push native builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ needs.precheck.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ needs.precheck.outputs.revision }}
            org.opencontainers.image.version=${{ needs.precheck.outputs.version }}
          cache-from: type=gha,scope=emqx-otp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=emqx-otp-${{ matrix.arch }}
      - name: Verify actual published runtime
        env:
          TAG: ${{ needs.precheck.outputs.version }}-${{ matrix.arch }}
        run: |
          docker pull "$IMAGE:$TAG"
          docker run --rm "$IMAGE:$TAG" check-emqx-otp

  publish:
    needs: [precheck, build]
    runs-on: ubuntu-24.04
    environment: docker
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish verified multi-architecture manifest
        env:
          VERSION: ${{ needs.precheck.outputs.version }}
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

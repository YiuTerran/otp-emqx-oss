name: Verify Actions Updater Migration

on:
  push:
    branches: [verify/actions-updater-v1]

permissions:
  contents: read

jobs:
  existing-authentication:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token using the existing workflow configuration
        id: generate_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate_token.outputs.token }}

  read-only-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Exercise the pinned composite action without opening a PR
        id: updater
        continue-on-error: true
        uses: saadmk11/github-actions-version-updater@764bee6cd2905c6c91624f35332f1472fa736c23 # v1.0.3
        with:
          token: ${{ github.token }}
          skip_pull_request: 'true'
          update_version_with: release-commit-sha
          pull_request_branch: github/actions-update
          extra_workflow_locations: .github/actions/build-base-image
      - name: Verify expected result and immutable rewritten pins
        env:
          UPDATER_OUTCOME: ${{ steps.updater.outcome }}
        run: |
          set -euo pipefail
          if [[ "$UPDATER_OUTCOME" == failure ]]; then
            # skip_pull_request intentionally exits 1 after updating files.
            test -n "$(git diff --name-only -- .github)"
          fi
          git diff --check
          python3 - <<'PY'
          import pathlib, re
          for path in pathlib.Path('.github').rglob('*'):
              if path.suffix not in {'.yml', '.yaml'}:
                  continue
              for line in path.read_text().splitlines():
                  match = re.match(r"\s*(?:-\s*)?uses:\s*['\"]?([^'\"\s#]+)", line)
                  if not match:
                      continue
                  value = match[1]
                  if value.startswith(('./', '${{')):
                      continue
                  pattern = r'@sha256:[0-9a-f]{64}$' if value.startswith('docker://') else r'@[0-9a-f]{40}$'
                  assert re.search(pattern, value), (str(path), value)
          print('All rewritten action references remain immutable.')
          PY
      - name: Recheck all updates using the same isolated package
        env:
          GHA_UPDATE_TOKEN: ${{ github.token }}
          UV_CACHE_DIR: ${{ runner.temp }}/update-gha/uv-cache
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/update-gha/python
          UV_TOOL_DIR: ${{ runner.temp }}/update-gha/tools
        run: |
          uv --no-config tool run --isolated --no-env-file \
            --managed-python --python 3.14 --default-index https://pypi.org/simple \
            --from 'update-gha[action]==1.0.3' update-gha \
            --no-pull-request --check --update-version-with release-commit-sha \
            --extra-workflow-locations .github/actions/build-base-image

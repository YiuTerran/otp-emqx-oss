name: Verify Actions Updater Migration

on:
  push:
    branches:
      - verify/actions-updater-v1

permissions:
  contents: read

jobs:
  existing-authentication:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.generate_token.outputs.token }}

  read-only-updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run composite without creating a PR
        id: updater
        continue-on-error: true
        uses: saadmk11/github-actions-version-updater@764bee6cd2905c6c91624f35332f1472fa736c23 # v1.0.3
        with:
          token: ${{ github.token }}
          skip_pull_request: 'true'
          update_version_with: release-commit-sha
          pull_request_branch: github/actions-update
          extra_workflow_locations: .github/actions/build-base-image
      - name: Check the updated checkout
        env:
          GHA_UPDATE_TOKEN: ${{ github.token }}
        run: |
          git diff --check
          uv --no-config tool run --isolated --no-env-file --managed-python --python 3.14 --default-index https://pypi.org/simple --from 'update-gha[action]==1.0.3' update-gha --no-pull-request --check --update-version-with release-commit-sha --extra-workflow-locations .github/actions/build-base-image

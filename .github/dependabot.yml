version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/build-base-image"
    target-branch: emqx-27.3.4.19-security
    schedule:
      interval: weekly
      day: sunday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
